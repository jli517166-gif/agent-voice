<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Voice · 朗读</title>
<style>
:root{color-scheme:light dark;font-family:var(--font-sans,system-ui,sans-serif);color:var(--color-text-primary,CanvasText);background:var(--color-background-primary,Canvas)}
*{box-sizing:border-box}body{margin:0;padding:18px;max-width:680px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}h1{font-size:17px;margin:0}p{font-size:12px;line-height:1.6;color:var(--color-text-secondary,GrayText)}label{display:block;font-size:13px;margin:12px 0 8px}textarea{width:100%;min-height:118px;resize:vertical;padding:12px;border:1px solid var(--color-border-primary,GrayText);border-radius:10px;background:var(--color-background-secondary,Canvas);color:inherit;font:inherit;font-size:14px;line-height:1.65}button{font:inherit;font-size:13px;border:1px solid var(--color-border-primary,GrayText);border-radius:9px;padding:9px 14px;background:var(--color-background-secondary,Canvas);color:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible,textarea:focus-visible{outline:2px solid #009ed0;outline-offset:2px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}.primary{background:#079dcc;border-color:#079dcc;color:#fff}#status{font-size:13px;line-height:1.6;min-height:42px}#notice{border-top:1px solid var(--color-border-secondary,GrayText);padding-top:12px;margin-bottom:0}.error{color:var(--color-text-danger,#c53737)}
</style>
<header><h1>Agent Voice · 朗读</h1><button id="refresh" disabled>刷新状态</button></header>
<div id="status" role="status" aria-live="polite">正在连接客户端界面桥接…</div>
<label for="text">朗读正文</label><textarea id="text" maxlength="4000" placeholder="填写正文，或让 Codex 把要朗读的内容放到面板。"></textarea>
<div class="actions"><button id="read" class="primary" disabled>朗读</button><button id="stop" disabled>停止朗读</button></div>
<p>使用 Agent Voice 当前声音；停止会同时清空等待队列。</p>
<p id="notice">服务、声音方案和自动朗读设置：通过 Codex 原生“语音控制”技能调用。这是插件面板，不接管客户端内置“朗读”。</p>
<script>
(() => {
  const $=id=>document.getElementById(id), pending=new Map();
  let nextId=1, connected=false, acting=false, context={};
  const show=(text,error=false)=>{$('status').textContent=text;$('status').className=error?'error':'';};
  function buttons(){for(const id of ['read','refresh','stop'])$(id).disabled=!connected||acting;}
  function request(method,params,timeout=45000){
    const id=nextId++;
    return new Promise((resolve,reject)=>{
      const timer=setTimeout(()=>{pending.delete(id);reject(new Error(method==='tools/call'?'操作等待超时，执行结果尚未确认，请刷新状态；朗读请勿重复提交。':'当前客户端没有完成 MCP Apps 界面连接，请使用“语音控制”技能。'));},timeout);
      pending.set(id,{resolve,reject,timer});
      window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');
    });
  }
  function hostContext(value){context={...context,...value};document.documentElement.style.colorScheme=context.theme==='dark'?'dark':context.theme==='light'?'light':'light dark';for(const [key,value] of Object.entries(context.styles?.variables||{}))if(key.startsWith('--')&&typeof value==='string')document.documentElement.style.setProperty(key,value);}
  function unpack(result){if(result?.isError)throw new Error(result.content?.find(item=>item.type==='text')?.text||'操作失败');if(result?.structuredContent)return result.structuredContent;const item=result?.content?.find(item=>item.type==='text');return item?JSON.parse(item.text):result;}
  function renderStatus(state){show(!state.running?'语音服务未启动；点击朗读会启动服务。':`服务已启动 · ${state.busy?'正在处理':'空闲'} · 等待 ${state.queued??0} 条${state.error?' · '+state.error:''}`,Boolean(state.error));}
  function apply(result){const data=unpack(result);if(data?.text!==undefined)$('text').value=data.text;if(data?.status)renderStatus(data.status);}
  async function call(name,args={}){return unpack(await request('tools/call',{name,arguments:args}));}
  window.addEventListener('message',event=>{
    if(event.source!==window.parent)return;const message=event.data;if(!message||message.jsonrpc!=='2.0')return;
    if(message.id!==undefined&&!message.method&&pending.has(message.id)){const item=pending.get(message.id);clearTimeout(item.timer);pending.delete(message.id);if(message.error)item.reject(new Error(message.error.message||'客户端拒绝操作'));else item.resolve(message.result);return;}
    if(message.method==='ping'&&message.id!==undefined){window.parent.postMessage({jsonrpc:'2.0',id:message.id,result:{}},'*');return;}
    if(message.method==='ui/notifications/tool-result')try{apply(message.params);}catch(error){show(error.message,true);}
    if(message.method==='ui/notifications/host-context-changed')hostContext(message.params||{});
    if(message.method==='ui/resource-teardown'){for(const item of pending.values()){clearTimeout(item.timer);item.reject(new Error('面板已关闭'));}pending.clear();connected=false;buttons();if(message.id!==undefined)window.parent.postMessage({jsonrpc:'2.0',id:message.id,result:{}},'*');}
  });
  $('refresh').onclick=async()=>{acting=true;buttons();try{renderStatus(await call('voice_service_status'));}catch(error){show(error.message,true);}finally{acting=false;buttons();}};
  $('read').onclick=async()=>{const text=$('text').value;if(!text.trim()){show('请先填写要朗读的正文。',true);return;}acting=true;buttons();show('正在提交朗读…');try{const data=await call('read_text',{text});show(data.skipped?'正文没有可朗读的文字。':'已加入朗读队列，将按顺序生成并播放。');}catch(error){show(error.message,true);}finally{acting=false;buttons();}};
  $('stop').onclick=async()=>{acting=true;buttons();try{await call('stop_speech');show('已停止朗读，并清空等待队列。');}catch(error){show(error.message,true);}finally{acting=false;buttons();}};
  async function connect(){
    try{
      const result=await request('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'agent-voice-player',version:'1.3.0'},appCapabilities:{},},8000);
      if(!result?.hostCapabilities?.serverTools)throw new Error('客户端未提供面板直接调用 MCP 的能力，请使用“语音控制”技能。');
      hostContext(result.hostContext||{});connected=true;buttons();
      window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},'*');
      renderStatus(await call('voice_service_status'));
      new ResizeObserver(()=>window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/size-changed',params:{height:document.documentElement.scrollHeight}},'*')).observe(document.body);
    }catch(error){show(error.message,true);}
  }
  connect();
})();
</script></html>
