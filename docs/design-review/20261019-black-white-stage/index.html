<script>
const $=s=>document.querySelector(s), icon=(id,cls='ico')=>`<svg class="${cls}"><use href="#av-symbol-${id}"/></svg>`;
const bars=()=>`<div class="sound-bars" aria-hidden="true">${Array.from({length:27},(_,i)=>`<b style="--h:${15+Math.round(65*Math.abs(Math.sin(i*.57))*Math.exp(-Math.abs(i-13)*.07))}px;--i:${i}"></b>`).join('')}</div>`;
const art=id=>`<div class="step-symbol" aria-hidden="true">${icon(id,'')}<div class="scan-line"></div></div>`;
const steps=[
 {name:'开场',title:'声音，<br>现在开始。',lead:'几步配置，交给你熟悉的声音。',type:'intro'},
 {name:'电脑',title:'从这台电脑开始。',lead:'先确认运行条件。',symbol:'computer',type:'computer'},
 {name:'引擎',title:'选择引擎。',lead:'决定声音如何生成。',symbol:'engine',type:'engine'},
 {name:'引擎资源',title:'准备引擎。',lead:'在线获取，或使用你已有的文件。',symbol:'package',type:'source'},
 {name:'运行环境',title:'环境就位。',lead:'依赖保存在软件里，换电脑也有迹可循。',symbol:'environment',type:'environment'},
 {name:'音色',title:'选择你的声音。',lead:'音色包保存声音，软件负责把它用起来。',type:'voice'},
 {name:'试听',title:'先听一听。',lead:'听到声音，再确认它是否合适。',type:'preview'},
 {name:'Harness',title:'接住你的对话。',lead:'选择需要自动朗读的客户端。',symbol:'harness',type:'harness'},
 {name:'AIRI',title:'让桌宠开口。',lead:'可选。不开启，也能正常在本机播放。',symbol:'airi',type:'airi'},
 {name:'完成',title:'准备好了。',lead:'未完成的项目，随时可以回来继续。',symbol:'finish',type:'finish'}
];
let step=0,mode='setup',deskPage='speech',engine='CosyVoice',source='在线准备',environment='在线补齐',voice='尚未选择',airi=false,sound=false,reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,service=false,playing=false,clients=new Set(['Codex']),timerIds=[],oscillators=[],ctx,activeAnimations=[],lastFocus;
const selections={};
function later(fn,ms){const id=setTimeout(fn,ms);timerIds.push(id);return id}
function clearTransient(){window.dispatchEvent(new Event('design-dispose'));timerIds.forEach(clearTimeout);timerIds=[];activeAnimations.forEach(a=>a.cancel());activeAnimations=[];document.querySelectorAll('.screen[aria-hidden="true"]').forEach(n=>n.remove());oscillators.forEach(o=>{try{o.stop()}catch{}});oscillators=[];playing=false}
function tone(kind=0,forced=false){if(!sound&&!forced)return;try{ctx??=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();const t=ctx.currentTime;const notes=kind===9?[174.61,261.63,349.23]:[174.61+kind*8,261.63+kind*9];notes.forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(f*1.08,t+i*.065);o.frequency.exponentialRampToValueAtTime(f,t+i*.065+.08);g.gain.setValueAtTime(0,t+i*.065);g.gain.linearRampToValueAtTime(.028,t+i*.065+.006);g.gain.exponentialRampToValueAtTime(.0001,t+i*.065+.18);o.connect(g).connect(ctx.destination);o.start(t+i*.065);o.stop(t+i*.065+.21);o.onended=()=>{o.disconnect();g.disconnect();oscillators=oscillators.filter(n=>n!==o)};oscillators.push(o)})}catch{}}
function option(name,desc,index,selected,action){return `<button class="option ${selected?'selected':''}" style="--i:${index}" data-action="${action}" data-value="${name}" role="${action==='client'?'checkbox':'radio'}" aria-checked="${selected}"><span class="option-no">${String(index+1).padStart(2,'0')}</span><span class="option-copy"><span class="option-name">${name}</span>${desc?`<span class="option-desc">${desc}</span>`:''}</span><span class="radio" aria-hidden="true"></span></button>`}
function link(text,action){return `<button class="text-link" data-action="${action}">${text}</button>`}
function content(s){switch(s.type){
case'intro':return `<div class="screen-content intro-content"><div><p class="eyebrow">本地语音工作台</p><h1>${s.title}</h1><p class="lead">${s.lead}</p><div class="intro-foot"><span></span>软件、引擎、音色，各自独立。</div></div><div class="boot-art" aria-hidden="true"><div class="boot-haze"></div><div class="bus"></div><div class="boot-tile">${icon('logo','')}</div><span class="calibration">LOCAL VOICE SYSTEM</span></div></div>`;
case'computer':return layout(s,`<button class="simple-action" data-action="computer">检测电脑 ${icon('arrow')}</button><div class="small-result" id="computerResult">检测结果会出现在这里。</div>${link('会检查哪些内容？','computerHelp')}`);
case'engine':return layout(s,`<div class="option-list" role="radiogroup" aria-label="TTS 引擎">${[['CosyVoice','音色克隆与表达'],['GPT-SoVITS · v5 Turbo','参考音色与快速生成'],['GPT-SoVITS · ProPlus','另一套声音方案']].map(([n,d],i)=>option(n,d,i,engine===n,'engine')).join('')}</div><div class="after-options">${link('如何选择？','engineHelp')}</div>`);
case'source':return layout(s,`<div class="option-list" role="radiogroup" aria-label="引擎资源来源">${[['在线准备','获取推荐资源，自动放到正确位置'],['导入引擎包','使用单独打包的 TTS 文件'],['指定已有目录','沿用自己安装的引擎']].map(([n,d],i)=>option(n,d,i,source===n,'source')).join('')}</div>`);
case'environment':return layout(s,`<div class="option-list" role="radiogroup" aria-label="运行环境准备方式">${[['在线补齐','检查缺项，再下载兼容的依赖'],['导入离线环境包','网络不便时，用完整离线文件补齐']].map(([n,d],i)=>option(n,d,i,environment===n,'environment')).join('')}</div><div class="after-options">${link('严格离线与兼容性','environmentHelp')}${link('指定已有路径','paths')}</div>`);
case'voice':return `<div class="screen-content"><div class="step-grid no-art"><p class="eyebrow">音色</p><h1>${s.title}</h1><p class="lead">${s.lead}</p><div class="option-list">${option('导入音色包',voice==='尚未选择'?'选择已经训练好的声音':`已选择：${voice}`,0,true,'importVoice')}${option('自行配置','选择参考录音与逐字台词',1,false,'reference')}</div><div class="after-options">${link('音色包和引擎有什么关系？','voiceHelp')}</div></div></div>`;
case'preview':return `<div class="screen-content"><div class="step-grid no-art"><p class="eyebrow">试听</p><h1>${s.title}</h1><p class="lead">${s.lead}</p><div class="voice-name">${voice==='尚未选择'?'待选择音色':voice} <span style="color:var(--muted);font-size:11px">${engine}</span></div>${bars()}<button class="simple-action" data-action="preview">${icon('play')} 体验试听动效</button><div class="small-result" id="previewResult">审核稿只演示音效与动效，不连接 TTS。</div></div></div>`;
case'harness':return layout(s,`<div class="option-list" aria-label="已支持的客户端">${[['Codex','MCP 语言控制与自动朗读'],['DeepSeek Harness','聊天栏入口与自动朗读']].map(([n,d],i)=>option(n,d,i,clients.has(n),'client')).join('')}</div><div class="after-options">${link('查看目录选择与验证流程','connectionFlow')}${link('其他客户端如何接入？','development')}</div>`);
case'airi':return layout(s,`<div class="switch-line"><span>AIRI 桌宠联动</span><button class="switch" role="switch" aria-label="启用 AIRI 桌宠联动" aria-checked="${airi}" data-action="airi"></button></div><div class="after-options">${link(airi?'选择原 AIRI 安装目录':'当前使用本机播放',airi?'airiFlow':'airiHelp')}</div>${airi?'<div class="small-result">只使用你已有的 AIRI；验证播放回执后才显示接入成功。</div>':''}`);
case'finish':return layout(s,`<div class="summary-list"><div class="summary-line"><span>${engine}</span><small>尚未安装验证</small></div><div class="summary-line"><span>${voice==='尚未选择'?'音色未选择':voice}</span><small>尚未试听确认</small></div><div class="summary-line"><span>${[...clients].join('、')||'手动朗读'}</span><small>尚未验证连接</small></div></div>`);
}}
function layout(s,body){return `<div class="screen-content"><div class="step-grid"><div><p class="eyebrow">${s.name}</p><h1>${s.title}</h1><p class="lead">${s.lead}</p>${body}</div>${art(s.symbol)}</div></div>`}
function show(n=step,animate=true){clearTransient();mode='setup';step=Math.max(0,Math.min(steps.length-1,n));$('#window').classList.remove('workspace');$('#showSetup').classList.add('active');$('#showDesk').classList.remove('active');$('#position').textContent=step===0?'首次使用':`${String(step).padStart(2,'0')} / 09`;$('#back').style.visibility=step?'visible':'hidden';$('#skip').hidden=step===0||step===9;$('#defer').textContent=step===0?'直接进入软件':'稍后配置';$('#next span').textContent=step===0?'开始配置':step===9?'进入工作台':'继续';$('#jump').value=String(step);const old=$('#screens .screen');const screen=document.createElement('section');screen.className='screen';screen.dataset.step=step;screen.setAttribute('aria-label',steps[step].name);screen.innerHTML=content(steps[step]);$('#screens').append(screen);if(old){old.setAttribute('aria-hidden','true');old.style.pointerEvents='none';if(animate&&!reduced){const a=old.animate([{opacity:1,transform:'translateX(0)'},{opacity:0,transform:'translateX(-22px)'}],{duration:180,easing:'cubic-bezier(.4,0,1,1)',fill:'forwards'});activeAnimations.push(a);a.onfinish=()=>old.remove()}else old.remove()}if(animate&&!reduced){const a=screen.animate([{opacity:0,transform:'translateX(26px)'},{opacity:1,transform:'translateX(0)'}],{duration:420,delay:old?120:0,easing:'cubic-bezier(.16,1,.3,1)',fill:'backwards'});activeAnimations.push(a);screen.querySelectorAll('.eyebrow,h1,.lead,.option-list,.simple-action').forEach((node,i)=>{const an=node.animate([{opacity:0,transform:'translateY(9px)'},{opacity:1,transform:'translateY(0)'}],{duration:400,delay:130+i*65,easing:'cubic-bezier(.16,1,.3,1)',fill:'backwards'});activeAnimations.push(an)})}if(sound&&animate)tone(step);screen.addEventListener('click',onAction);history.replaceState(null,'',`#setup-${step}`);window.dispatchEvent(new Event('design-route'))}
function onAction(e){const target=e.target.closest('[data-action]');if(!target)return;const action=target.dataset.action,value=target.dataset.value;if(action==='engine'){if(engine!==value)voice='尚未选择';engine=value;show(step,false);tone(2)}else if(action==='source'){source=value;show(step,false);tone(3);if(value==='指定已有目录')openPaths()}else if(action==='environment'){environment=value;show(step,false);tone(4)}else if(action==='client'){clients.has(value)?clients.delete(value):clients.add(value);show(step,false);tone(7)}else if(action==='airi'){airi=!airi;show(step,false);tone(8)}else if(action==='computer'){target.textContent='检测动画演示中…';target.disabled=true;$('#computerResult').textContent='检查显卡、磁盘和软件目录…（示意）';later(()=>{$('#computerResult').innerHTML='<strong>检测完成的结果示意</strong><br>正式实现将展示当前电脑信息与失败处理。';target.textContent='重新体验检测';target.disabled=false;tone(9)},1100)}else if(action==='preview'){const screen=target.closest('.screen');screen.classList.add('playing');$('#previewResult').textContent='正在演示播放状态…';tone(9,true);later(()=>{screen.classList.remove('playing');$('#previewResult').textContent='动效演示结束。正式版收到播放回执后，还需要你确认听感。'},1700)}else if(action==='importVoice')openModal('导入音色包',`<p>正式版会选择 .cosyvoice.ttsmodel 或 .gpt-sovits.ttsmodel，并自动匹配对应引擎。</p><label>体验文件选择（仅显示文件名，不读取或上传）<input type="file" id="modelFile" accept=".ttsmodel"></label><p class="status-preview">模型完整性、运行环境和实际播放在正式版分别验证。</p><button class="simple-action" id="useDemoVoice">用 Fairy 名称预览布局 ${icon('arrow')}</button>`,()=>{$('#modelFile').addEventListener('change',e=>{if(e.target.files[0]){voice=e.target.files[0].name;closeModal();show(step,false)}});$('#useDemoVoice').onclick=()=>{voice='Fairy';closeModal();show(step,false)}});else if(action==='reference')openModal('自行配置参考声音',`<p>展开后再处理具体参数，主配置页面保持简洁。</p><label>参考音频<input type="file" accept="audio/*"></label><label>逐字台词<textarea placeholder="填写与参考录音一致的台词" rows="3"></textarea></label><button class="primary" id="referenceDone">预览已填写状态 ${icon('arrow')}</button><p class="status-preview">审核稿不会保存文件或声音参数。</p>`,()=>$('#referenceDone').onclick=()=>{voice='自定义声音（示意）';closeModal();show(step,false)});else if(action==='paths')openPaths();else openHelp(action)}
function openPaths(){openModal('指定已有引擎',`<p>正式版可定位引擎目录和独立运行环境。默认自动匹配，手动路径收在此处。</p><label>引擎目录<input placeholder="选择本机已有的引擎文件夹" aria-label="引擎目录示意"></label><label>Python 运行环境<input placeholder="选择引擎专用 python.exe" aria-label="Python 路径示意"></label><button class="primary" id="pathDone">返回配置 ${icon('arrow')}</button><p class="status-preview">设计预览，不读取或写入这些路径。</p>`,()=>$('#pathDone').onclick=closeModal)}
const help={computerHelp:['电脑检查','检查操作系统、显卡／驱动、剩余空间和目录写入权限。缺少什么、为什么失败、如何修复，在结果区按需展开。文件存在不会被当作生成成功。'],engineHelp:['选择哪个引擎？','CosyVoice 保留本地克隆与表达方式；GPT-SoVITS 可分别使用 v5 Turbo、ProPlus。每种引擎使用自己的运行环境。选择后可以导入引擎包、联网准备，或定位现有目录。'],environmentHelp:['严格离线','导入离线环境包时不暗中联网。环境包必须匹配引擎、Windows 64 位与显卡档位；显卡驱动仍需系统正确安装。缺件只报告缺项与处理办法。'],voiceHelp:['音色与引擎','音色包属于特定 TTS，引擎提供实际生成能力。包的后缀和内部清单共同确定类型；轻量包复用基础模型，模型完整包包含相应权重。高级选项仅在导入导出页面展开。'],connectionFlow:['接入与验证','选择 Codex 或 DeepSeek Harness 目录 → 自动识别 → 安装连接器 → 发起随机真实回复 → 等待实际播放回执。桌面登录无法自动执行时，明确停在哪一步并显示需要手动发送的短句。'],development:['扩展其他 Harness','首版正式支持 Codex、DeepSeek Harness。其他客户端通过独立连接器模板二次开发，按同样的真实回复和播放标准验证，不显示未经实测的成功开关。'],airiHelp:['AIRI 可选','关闭 AIRI 时由本机扬声器播放。开启后选择已经登录的原 AIRI 安装目录，不复制第二套 AIRI。'],airiFlow:['连接原 AIRI','选择原目录 → 安装桥接并保留备份 → 等待桥接连通 → 发起真实播放 → 收到桌宠播放完成回执后庆祝。AIRI 更新可能覆盖桥接，失效后重新接入验证。']};
function openHelp(key){if(help[key])openModal(help[key][0],`<p>${help[key][1]}</p><button class="simple-action" id="stateExample">查看成功／失败状态设计 ${icon('arrow')}</button>`,()=>$('#stateExample').onclick=showStateExamples)}
function showStateExamples(){openModal('验证反馈 · 状态设计',`<p>下面是两个独立的视觉示例，不代表本机连接结果。</p><h3>未通过</h3><p class="error-copy">停在“启动真实验证会话”。请确认客户端已经登录，再重试；也可发送验证短句。</p><div class="inline-row"><button class="simple-action" id="retryExample">重试示意 ${icon('replay')}</button><button class="text-link" id="copyExample">查看手动步骤</button></div><h3>通过后的反馈</h3><p>正文、来源、播放回执都通过后，才出现一次短暂的彩带庆祝，并显示“接入成功”。</p><button class="simple-action" id="successExample">预览通过动效 ${icon('play')}</button><div id="exampleResult" class="small-result"></div>`,()=>{$('#retryExample').onclick=()=>$('#exampleResult').textContent='示意：重新执行当前失败步骤，不把安装完成当作验证通过。';$('#copyExample').onclick=()=>$('#exampleResult').textContent='示意：显示随机验证短句与对应客户端的发送步骤。';$('#successExample').onclick=()=>{tone(9,true);$('#exampleResult').innerHTML='<strong>恭喜接入成功 · 示例</strong>';const a=$('#exampleResult').animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'translateY(0)'}],{duration:450,easing:'ease-out'});if(reduced)a.finish();confetti()}})}
function confetti(){if(reduced)return;const host=$('#modal');for(let i=0;i<38;i++){const piece=document.createElement('i');piece.style.cssText=`position:fixed;top:14%;left:${10+Math.random()*80}%;height:${6+i%7}px;width:3px;background:${i%3?'#f3f5f8':'#ae94ff'};pointer-events:none`;host.append(piece);const a=piece.animate([{opacity:0,transform:'translateY(-20px) rotate(0)'},{opacity:1,offset:.1},{opacity:0,transform:`translate(${(Math.random()-.5)*160}px,60vh) rotate(${i*25}deg)`}],{duration:900+Math.random()*500,easing:'cubic-bezier(.2,.6,.3,1)'});a.onfinish=()=>piece.remove()}}
function openModal(title,html,setup){lastFocus=document.activeElement;$('#modalTitle').textContent=title;$('#modalContent').innerHTML=html;$('#modal').hidden=false;$('#closeModal').focus();if(setup)setup()}

$('#closeModal').onclick=closeModal;$('#modal').onclick=e=>{if(e.target===$('#modal'))closeModal()};

$('#jump').innerHTML=steps.map((s,i)=>`<option value="${i}">${i===0?'开场':String(i).padStart(2,'0')+' · '+s.name}</option>`).join('')+'<option value="desk">日常工作台</option>';$('#jump').onchange=e=>e.target.value==='desk'?showDesk():show(+e.target.value);$('#next').onclick=()=>step===9?showDesk('speech'):show(step+1);$('#back').onclick=()=>show(step-1);$('#skip').onclick=()=>show(step+1);$('#defer').onclick=()=>showDesk('speech');$('#showSetup').onclick=()=>show(step);$('#showDesk').onclick=()=>showDesk('speech');$('#replay').onclick=()=>mode==='setup'?show(step):showDesk();$('#soundToggle').onclick=()=>{sound=!sound;$('#soundToggle').textContent=sound?'音效开':'音效关';$('#soundToggle').setAttribute('aria-pressed',sound);if(sound)tone(0)};$('#motionToggle').onclick=()=>{reduced=!reduced;document.body.classList.toggle('reduced',reduced);$('#motionToggle').setAttribute('aria-pressed',reduced);activeAnimations.forEach(a=>a.finish());if(mode==='setup'&&!window.reviewTasks?.isActive())show(step,false)};document.body.classList.toggle('reduced',reduced);$('#motionToggle').setAttribute('aria-pressed',reduced);$('#audition').onclick=()=>{sound=true;$('#soundToggle').textContent='音效开';$('#soundToggle').setAttribute('aria-pressed',true);tone(9,true)};
$('#references').onclick=()=>openModal('参考与设计说明',`<p>主要动画参考来自你提供的本地视频：7–11 秒的斜轨聚焦、11–16 秒的表单建立、16–19 秒的状态切换。所有标识和音效均重新设计，没有使用游戏人物、商标或视频原配乐。</p><h3>本稿的删减</h3><p>移除玻璃大图、插画加卡片的双栏模板、长说明和成排功能按钮。每页一个决定；手动路径和解释再展开。工作台保持另一套日常布局。</p><h3>演示稿与发布素材</h3><p><a href="https://pitch.com/templates/Product-Launch-45y9rQ5k17oP4r4fwd5aoeik" target="_blank" rel="noreferrer">Pitch · Product Launch</a><br><a href="https://news.microsoft.com/june-24-2021/" target="_blank" rel="noreferrer">Microsoft · Windows 11 发布素材</a></p><p>已检索官方 Apple／Windows／Nothing 视频来源；在线播放受人机验证限制，未声称完整观看。逐帧动效研究依据你提供的 22 秒本地视频。</p><h3>审核范围</h3><p>这里只审核设计与动效。所有连接、安装、导入、声音生成均为示意，不操作本机文件或软件服务。</p><p><a href="设计与素材说明.md" target="_blank">完整设计说明</a></p>`);

document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#modal').hidden){closeModal();return}activeAnimations.forEach(a=>{try{a.finish()}catch{}});$('#screens').querySelectorAll('*').forEach(n=>n.getAnimations().forEach(a=>{try{a.finish()}catch{}}))}if(!$('#modal').hidden&&e.key==='Tab'){const focus=[...$('#modal').querySelectorAll('button,a,input,textarea,select')].filter(n=>!n.disabled);if(e.shiftKey&&document.activeElement===focus[0]){e.preventDefault();focus.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===focus.at(-1)){e.preventDefault();focus[0].focus()}}});
