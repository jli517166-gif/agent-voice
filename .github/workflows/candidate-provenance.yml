name: Candidate build provenance (not a public release)
on:
  workflow_dispatch:
    inputs:
      attest:
        description: 'Generate GitHub/Sigstore provenance; private repos require an eligible Enterprise Cloud plan'
        required: true
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -r tools/core-requirements.txt
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: node --test tests/test_connector.mjs tests/test_deepseek_control_client.mjs
      - shell: powershell
        run: ./build.ps1
      - shell: powershell
        run: ./tests/check_first_run.ps1
      - name: Generate provenance for the exact executable
        if: ${{ inputs.attest }}
        uses: actions/attest@v4
        with:
          subject-path: 'dist/agent语音.exe'
      - name: Record scope
        shell: powershell
        run: |
          'This is a candidate executable, not a public release or license clearance.' >> $env:GITHUB_STEP_SUMMARY
          'Attestation establishes build identity, not voice rights, sandbox safety or Windows Authenticode signing.' >> $env:GITHUB_STEP_SUMMARY
          if('${{ inputs.attest }}' -ne 'true'){'No provenance signature requested; do not label this candidate as signed.' >> $env:GITHUB_STEP_SUMMARY}
