name: Windows regression
on: [push, pull_request]
env:
  PYTHONUTF8: "1"
jobs:
  regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -r tools/core-requirements.txt
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: node --test tests/test_connector.mjs tests/test_deepseek_control_client.mjs tests/test_mouth.mjs tests/test_setup_frontend.mjs
      - shell: powershell
        run: ./build.ps1
      - shell: powershell
        run: ./tests/check_first_run.ps1
      - shell: powershell
        run: |
          $env:AGENT_VOICE_TEST_PYTHON=(Get-Command python).Source
          $exe=Join-Path $PWD 'dist\agent语音.exe'
          foreach ($case in @('privacy-test','websetup-unit','selftest')) {
            $output=Join-Path $PWD ('acceptance\'+$case)
            $check=Start-Process -FilePath $exe -ArgumentList @('--'+$case,$output) -WindowStyle Hidden -PassThru -Wait
            if($check.ExitCode -ne 0){throw ('Failed '+$case)}
          }
